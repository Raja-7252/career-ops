name: Daily Job Alert Email

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  send_job_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yagmail

      - name: Send job alert email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python << 'EOF'
          import os
          import json
          from datetime import datetime, timedelta
          import urllib.request
          import urllib.parse
          import yagmail

          # -------- 1) Define your profile --------
          profile = {
              "titles": [
                  "Business Analyst",
                  "Data Analyst",
                  "Healthcare Analyst",
                  "BI Analyst"
              ],
              "industries": [
                  "Healthcare",
                  "Health",
                  "Insurance",
                  "Analytics"
              ],
              "locations": [
                  "Remote",
                  "Birmingham, AL",
                  "Alabama",
                  "United States"
              ],
              "skills": [
                  "SQL",
                  "Python",
                  "Power BI",
                  "Tableau",
                  "Excel"
              ]
          }

          # -------- 2) Collect jobs from Adzuna --------
          jobs = []

          # 2a) Adzuna (US)
          app_id = os.getenv("ADZUNA_APP_ID")
          app_key = os.getenv("ADZUNA_APP_KEY")

          print(f"ADZUNA_APP_ID present: {bool(app_id)}")
          print(f"ADZUNA_APP_KEY present: {bool(app_key)}")

          if app_id and app_key:
              # Search mainly for Business Analyst; scoring will also allow Data Analyst, etc.
              query = "business analyst"

              params = {
                  "app_id": app_id,
                  "app_key": app_key,
                  "what": query,
                  "where": "United States",
                  "results_per_page": 25,
                  "content-type": "application/json"
              }
              adzuna_url = "https://api.adzuna.com/v1/api/jobs/us/search/1?" + urllib.parse.urlencode(params)
              print(f"Calling Adzuna URL: {adzuna_url}")

              try:
                  with urllib.request.urlopen(adzuna_url) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      results = data.get("results", [])
                      print(f"Adzuna returned {len(results)} results")

                      # -------- 2b) Define filter for bad jobs (contract / staffing) --------
                      def is_bad_job(job):
                          title = job.get("title", "").lower()
                          descr = job.get("description", "").lower()
                          company = job.get("company", "").lower()

                          # Words that usually mean contract / staffing / third-party
                          bad_keywords = [
                              "staffing agency",
                              "staffing firm",
                              "recruitment agency",
                              "recruiting agency",
                              "consulting firm",
                              "3rd party",
                              "third party",
                              "corp to corp",
                              "c2c",
                              "contract role",
                              "contract position",
                              "w2 contract",
                              "1099"
                          ]

                          # Known staffing/consulting companies you want to avoid
                          bad_companies = [
                              "insight global",
                              "apex systems",
                              "manpowergroup",
                              "robert half",
                              "system one",
                              "adecco",
                              "axelon"
                          ]

                          if any(k in descr or k in title for k in bad_keywords):
                              return True

                          if any(bc in company for bc in bad_companies):
                              return True

                          return False

                      for item in results:
                          job = {
                              "source": "Adzuna",
                              "title": item.get("title", ""),
                              "company": item.get("company", {}).get("display_name", "Unknown"),
                              "location": item.get("location", {}).get("display_name", ""),
                              "posted": item.get("created", "")[:10],
                              "industry": item.get("category", {}).get("label", ""),
                              "description": item.get("description", ""),
                              "link": item.get("redirect_url", "")
                          }

                          # Skip bad jobs (contract / staffing / third-party)
                          if is_bad_job(job):
                              continue

                          jobs.append(job)
              except Exception as e:
                  print("Error fetching jobs from Adzuna:", e)
          else:
              print("Missing ADZUNA_APP_ID or ADZUNA_APP_KEY")

          print(f"Total jobs pulled before scoring: {len(jobs)}")

          # -------- 3) Score jobs (stronger weights so 90+ means 'very good') --------
          def score_job(job):
              score = 0

              title = job.get("title", "").lower()
              descr = job.get("description", "").lower()
              company = job.get("company", "").lower()
              location = job.get("location", "").lower()
              industry = job.get("industry", "").lower()

              # Title match (very strong)
              for t in profile["titles"]:
                  if t.lower() in title:
                      score += 40

              # Extra bonus if explicitly Business Analyst
              if "business analyst" in title:
                  score += 20

              # Skills in description (stronger now)
              for s in profile["skills"]:
                  if s.lower() in descr:
                      score += 8

              # Industry match
              for ind in profile["industries"]:
                  if ind.lower() in industry or ind.lower() in descr:
                      score += 10

              # Location / remote hints (stronger)
              for loc in profile["locations"]:
                  if loc.lower() in location or loc.lower() in descr:
                      score += 10

              # Slight bonus for well‑known companies (example list – customize)
              good_companies = ["blue cross", "humana", "optum", "cvs", "unitedhealth", "kaiser", "amazon"]
              if any(gc in company for gc in good_companies):
                  score += 10

              # Recency bonus (stronger)
              posted = job.get("posted", "")
              if posted:
                  try:
                      posted_dt = datetime.fromisoformat(posted)
                      days_ago = (datetime.utcnow() - posted_dt).days
                      if days_ago <= 3:
                          score += 20
                      elif days_ago <= 7:
                          score += 15
                      elif days_ago <= 14:
                          score += 10
                  except Exception:
                      pass

              return score

          scored_jobs = []
          for j in jobs:
              j_score = score_job(j)
              j["score"] = j_score
              scored_jobs.append(j)

          scored_jobs.sort(key=lambda x: x["score"], reverse=True)

          # Keep only jobs with score >= 90
          better_fit_jobs = [j for j in scored_jobs if j["score"] >= 90]

          today_str = datetime.utcnow().strftime("%Y-%m-%d")

          # -------- 4) Build email body --------
          if not better_fit_jobs:
              body_text = f"No better‑fit jobs (score 90+) found today ({today_str}).\n"
          else:
              lines = []
              lines.append(f"Top better‑fit jobs for {today_str} (score 90+)\n")
              for idx, job in enumerate(better_fit_jobs, start=1):
                  lines.append(f"{idx}. [{job['source']}] {job['title']} at {job['company']}")
                  loc = job.get("location", "")
                  posted = job.get("posted", "")
                  if loc or posted:
                      lines.append(f"   Location: {loc or 'N/A'} | Posted: {posted or 'N/A'}")
                  lines.append(f"   Link: {job['link']}")
                  lines.append(f"   Score: {job['score']}")
                  lines.append("")  # blank line between jobs
              body_text = "\n".join(lines)

          # -------- 5) Send email via Gmail SMTP --------
          email_address = os.getenv("EMAIL_ADDRESS")
          email_pass = os.getenv("EMAIL_APP_PASSWORD")

          if not email_address or not email_pass:
              raise RuntimeError("Missing EMAIL_ADDRESS or EMAIL_APP_PASSWORD env vars")

          subject = f"Top Job Matches for {today_str}"

          try:
              yag = yagmail.SMTP(email_address, email_pass)
              yag.send(
                  to=email_address,
                  subject=subject,
                  contents=body_text
              )
              print("Email sent successfully.")
          except Exception as e:
              print("Error sending email:", e)

          EOF
