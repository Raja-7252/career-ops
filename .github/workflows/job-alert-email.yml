name: Send Job Alert Email

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Send job alert email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          python << 'EOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          sender = "rajakalyanapu1999@gmail.com"
          receiver = os.getenv("EMAIL_ADDRESS")
          password = os.getenv("EMAIL_APP_PASSWORD")

          print("DEBUG receiver:", receiver)
          print("DEBUG password is None:", password is None)

          subject = "Daily Job Alert Test from GitHub Actions"
          body = """
          Hello,

          This is a test email from your GitHub Actions job alert workflow.

          If you receive this, your email setup is working.

          Best,
          Your Job Alert Bot
          """

          msg = MIMEMultipart()
          msg["From"] = sender
          msg["To"] = receiver
          msg["Subject"] = subject
          msg.attach(MIMEText(body, "plain"))

          server = smtplib.SMTP("smtp.gmail.com", 587)
          server.starttls()
          server.login(sender, password)
          server.send_message(msg)
          server.quit()

          print("Email sent successfully")
          EOF
